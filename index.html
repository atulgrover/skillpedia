  <meta property="twitter:title" content="SkillPedia - National Skill Video Portal">
  <meta property="twitter:description" content="Explore standardized 11-reel vocational skill courses and instant AI micro-learning modules on SkillPedia.">
  <meta property="twitter:image" content="https://skillpedia.pages.dev/og_banner.png">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkillPedia">
  <link rel="apple-touch-icon" href="./AAS/logo_dark.png">

</head>
<body>

  <div class="app-container">

    <!-- TOP NAVBAR -->
    <header class="navbar">
      <a href="#" class="brand">
        <div class="brand-logo-box">
          <img src="./AAS/logo_dark.png" alt="Hayagriva Logo" class="logo-dark">
          <img src="./AAS/logo_light.png" alt="Hayagriva Logo" class="logo-light">
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="brand-title">SkillPedia</span>
          <span class="brand-badge" style="background: #a855f7; color: #ffffff; font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 6px;">v13.0-LIVE</span>
        </div>
      </a>

      <div class="nav-controls" style="display: flex; align-items: center; gap: 10px;">
        <button id="navAuthBtn" class="btn-secondary" onclick="authClient.requireCreatorAuth(() => {})" style="padding: 6px 14px; font-weight: 700; border-radius: 10px; font-size: 13px; font-family: inherit; cursor: pointer;">🔐 Sign In (Creator Mode)</button>
        <button id="pwaInstallBtn" class="btn-install-pwa" style="display: none;" onclick="installPWA()">📲 Install App</button>
        <button id="themeToggleBtn" class="btn-icon" aria-label="Toggle Theme" onclick="toggleTheme()">🌙</button>
      </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="main-wrapper">

      <main class="catalogue-panel">
        
        <!-- ULTRA-SIMPLE SINGLE LINE SEARCH & BUILD BAR (v13.0-LIVE) -->
        <div class="search-build-bar" style="display: flex; gap: 12px; align-items: center; background: var(--bg-card); padding: 12px 16px; border-radius: 16px; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-card); margin-bottom: 20px;">
          <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
            <span style="font-size: 18px; opacity: 0.7;">🔍</span>
            <input type="text" id="universalSearchInput" class="search-input" placeholder="[v13.0] Type any skill to search or build (e.g. Real Estate Sales, Dog Grooming, Car Driving)..." style="border: none; background: transparent; outline: none; width: 100%; font-size: 15px; color: var(--text-primary);">
          </div>
          <button id="btnBuildSkill" class="btn-primary" onclick="buildSearchedSkill()" style="white-space: nowrap; padding: 10px 20px; font-weight: 700; border-radius: 12px; display: flex; align-items: center; gap: 6px;">
            ✨ Build 11-Reel Skill Pack
          </button>
        </div>

        <div id="aiErrorMsg" class="error-banner" style="display: none; margin-bottom: 16px;"></div>

        <!-- AI SYNTHESIS LIVE PROGRESS & SPINNER MODAL OVERLAY -->
        <div id="aiProgressModal" class="modal-backdrop hidden" style="display: none; align-items: center; justify-content: center; z-index: 10000;">
          <div class="modal-card" style="max-width: 480px; width: 90%; padding: 28px; background: var(--bg-drawer); border: 1px solid var(--accent-cyan-border); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center;">
            <div style="position: relative; width: 64px; height: 64px; margin: 0 auto 20px auto;">
              <div style="width: 64px; height: 64px; border: 4px solid rgba(56, 189, 248, 0.2); border-top: 4px solid var(--accent-cyan); border-radius: 50%; animation: spin 1s linear infinite;"></div>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px;">✨</div>
            </div>

            <h3 style="font-size: 18px; font-weight: 800; color: var(--text-primary); margin: 0 0 6px 0;">Building 11-Reel Skill Course</h3>
            <p id="aiProgressTopicName" style="font-size: 14px; font-weight: 700; color: var(--accent-cyan); margin: 0 0 16px 0;">"Tea Plantation"</p>

            <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; margin-bottom: 16px;">
              <div id="aiProgressBarFill" style="width: 15%; height: 100%; background: linear-gradient(90deg, #38bdf8, #c084fc); transition: width 0.3s ease;"></div>
            </div>

            <div id="aiProgressLogText" style="font-size: 13px; color: var(--text-secondary); background: var(--bg-card); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-subtle); font-family: inherit; min-height: 42px; display: flex; align-items: center; justify-content: center;">
              Synthesizing 11 NOS Units & Performance Criteria...
            </div>
          </div>
        </div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

        <!-- UNIFIED SKILL CARDS GRID & CATEGORY TABS -->
        <div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <h2 style="font-size: 18px; font-weight: 800; color: var(--text-primary); margin: 0;">📚 Skill Courses Library</h2>
              <span id="skillCountBadge" style="font-size: 12px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 10px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3);">Loading...</span>
            </div>

            <!-- TWO CATEGORY FILTER TABS -->
            <div style="display: flex; gap: 8px;">
              <button class="sector-chip active" onclick="filterBySector('all', this)" style="padding: 6px 14px; font-size: 13px; font-weight: 700; border-radius: 10px; cursor: pointer;">🌐 All Courses</button>
              <button class="sector-chip" onclick="filterBySector('nsqf_official', this)" style="padding: 6px 14px; font-size: 13px; font-weight: 700; border-radius: 10px; cursor: pointer;">🇮🇳 Official NSQF</button>
              <button class="sector-chip" onclick="filterBySector('custom_ai', this)" style="padding: 6px 14px; font-size: 13px; font-weight: 700; border-radius: 10px; cursor: pointer;">✨ AI & Custom Packs</button>
            </div>
          </div>

          <div id="unifiedGrid" class="qp-grid">
            <!-- All Skill Cards (Official & Custom) rendered seamlessly here -->
          </div>
        </div>

      </main>

      <!-- RIGHT PANEL: 11-REEL STANDARDIZED PLAYER INSPECTOR -->
      <aside id="sideInspector" class="side-inspector hidden">
        <!-- Dynamic 11-Reel Player Template rendered by reelViewer.js -->
      </aside>

    </div>

    <!-- LEARNER FULLSCREEN MODAL (for deep-link direct skill view on mobile & desktop) -->
    <div id="learnerModal" class="learner-modal hidden">
      <div class="learner-modal-header">
        <span class="learner-modal-brand">🎓 SkillPedia</span>
        <button onclick="closeLearnerModal()" class="learner-modal-close">✕ Explore All Skills</button>
      </div>
      <div id="learnerModalContent" class="learner-modal-body">
        <!-- 11-Reel Player rendered here for deep-link views -->
      </div>
    </div>

    <!-- SHARE URL & QR MODAL -->
    <div id="shareModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h2>🎉 Employee Skill-Reel Link Ready</h2>
        <p>Share this link with your employees or print the QR code for instant phone access:</p>
        
        <div style="margin: 16px 0;">
          <input type="text" id="shareUrlInput" class="form-control" readonly style="font-family: monospace;">
          <button class="btn-primary" style="margin-top: 8px; width: 100%;" onclick="copyShareUrl()">📋 Copy Share Link</button>
        </div>

        <div id="qrCodeBox" style="text-align: center; margin: 16px 0;"></div>

        <button class="btn-secondary" style="width: 100%;" onclick="closeShareModal()">Close</button>
      </div>
    </div>

  </div>

  <!-- Dependencies with Cache-Busting Versioning v13.0-LIVE -->
  <script src="./js/config.js?v=13.0"></script>
  <script src="./js/mockData.js?v=13.0"></script>
  <script src="./js/schemas.js?v=13.0"></script>
  <script src="./js/contentFilter.js?v=13.0"></script>
  <script src="./js/tursoClient.js?v=13.0"></script>
  <script src="./js/auth.js?v=13.0"></script>
  <script src="./js/aiEngine.js?v=13.0"></script>
  <script src="./js/reelViewer.js?v=13.0"></script>
  <script src="./js/app.js?v=13.0"></script>
</body>
</html>
