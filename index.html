<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkillPedia - National Skill Video Portal (PWA)</title>
  <meta name="title" content="SkillPedia - National Skill Video Portal (PWA)">
  <meta name="description" content="Explore standardized 11-reel vocational skill courses and instant AI micro-learning modules on SkillPedia.">

  <!-- HTTP No-Cache Headers for Instant Browser Updates -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://skillpedia.pages.dev/">
  <meta property="og:title" content="SkillPedia - National Skill Video Portal">
  <meta property="og:description" content="Explore standardized 11-reel vocational skill courses and instant AI micro-learning modules on SkillPedia.">
  <meta property="og:image" content="https://skillpedia.pages.dev/og_banner.png">
  <meta property="og:image:secure_url" content="https://skillpedia.pages.dev/og_banner.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://skillpedia.pages.dev/">
  <meta property="twitter:title" content="SkillPedia - National Skill Video Portal">
  <meta property="twitter:description" content="Explore standardized 11-reel vocational skill courses and instant AI micro-learning modules on SkillPedia.">
  <meta property="twitter:image" content="https://skillpedia.pages.dev/og_banner.png">

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkillPedia">
  <link rel="apple-touch-icon" href="./AAS/logo_dark.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/portal.css">
</head>
<body>

  <div class="app-container">

    <!-- TOP NAVBAR -->
    <header class="navbar">
      <a href="#" class="brand">
        <div class="brand-logo-box">
          <img src="./AAS/logo_dark.png" alt="Hayagriva Logo" class="logo-dark">
          <img src="./AAS/logo_light.png" alt="Hayagriva Logo" class="logo-light">
        </div>
        <div>
          <span class="brand-title">SkillPedia</span>
          <span class="brand-badge">PWA</span>
        </div>
      </a>

      <div class="nav-controls">
        <button id="pwaInstallBtn" class="btn-install-pwa" style="display: none;" onclick="installPWA()">📲 Install App</button>
        <button id="themeToggleBtn" class="btn-icon" aria-label="Toggle Theme" onclick="toggleTheme()">🌙</button>
      </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="main-wrapper">

      <main class="catalogue-panel">
        
        <!-- ULTRA-SIMPLE SINGLE LINE SEARCH & BUILD BAR -->
        <div class="search-build-bar" style="display: flex; gap: 12px; align-items: center; background: var(--bg-card); padding: 12px 16px; border-radius: 16px; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-card); margin-bottom: 24px;">
          <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
            <span style="font-size: 18px; opacity: 0.7;">🔍</span>
            <input type="text" id="universalSearchInput" class="search-input" placeholder="Type any skill to search or build (e.g. Basil Plantation, Car Driving, Web Developer)..." style="border: none; background: transparent; outline: none; width: 100%; font-size: 15px; color: var(--text-primary);">
          </div>
          <button id="btnBuildSkill" class="btn-primary" onclick="buildSearchedSkill()" style="white-space: nowrap; padding: 10px 20px; font-weight: 700; border-radius: 12px; display: flex; align-items: center; gap: 6px;">
            ✨ Build 11-Reel Skill Pack
          </button>
        </div>

        <div id="aiErrorMsg" class="error-banner" style="display: none; margin-bottom: 16px;"></div>

        <!-- UNIFIED SKILL CARDS GRID -->
        <div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <h2 style="font-size: 18px; font-weight: 800; color: var(--text-primary); margin: 0;">📚 Skill Courses Library</h2>
              <span id="skillCountBadge" style="font-size: 12px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 10px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3);">Loading...</span>
            </div>
          </div>

          <div id="unifiedGrid" class="qp-grid">
            <!-- All Skill Cards (Official & Custom) rendered seamlessly here -->
          </div>
        </div>

      </main>

      <!-- RIGHT PANEL: 11-REEL STANDARDIZED PLAYER INSPECTOR -->
      <aside id="sideInspector" class="side-inspector hidden">
        <!-- Dynamic 11-Reel Player Template rendered by reelViewer.js -->
      </aside>

    </div>

    <!-- LEARNER FULLSCREEN MODAL (for deep-link direct skill view on mobile & desktop) -->
    <div id="learnerModal" class="learner-modal hidden">
      <div class="learner-modal-header">
        <span class="learner-modal-brand">🎓 SkillPedia</span>
        <button onclick="closeLearnerModal()" class="learner-modal-close">✕ Explore All Skills</button>
      </div>
      <div id="learnerModalContent" class="learner-modal-body">
        <!-- 11-Reel Player rendered here for deep-link views -->
      </div>
    </div>

    <!-- SHARE URL & QR MODAL -->
    <div id="shareModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h2>🎉 Employee Skill-Reel Link Ready</h2>
        <p>Share this link with your employees or print the QR code for instant phone access:</p>
        
        <div style="margin: 16px 0;">
          <input type="text" id="shareUrlInput" class="form-control" readonly style="font-family: monospace;">
          <button class="btn-primary" style="margin-top: 8px; width: 100%;" onclick="copyShareUrl()">📋 Copy Share Link</button>
        </div>

        <div id="qrCodeBox" style="text-align: center; margin: 16px 0;"></div>

        <button class="btn-secondary" style="width: 100%;" onclick="closeShareModal()">Close</button>
      </div>
    </div>

  </div>

  <!-- Dependencies -->
  <script src="./js/config.js"></script>
  <script src="./js/mockData.js"></script>
  <script src="./js/schemas.js"></script>
  <script src="./js/contentFilter.js"></script>
  <script src="./js/tursoClient.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/aiEngine.js"></script>
  <script src="./js/reelViewer.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
